name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto atualizado
        run: |
          unzip -o DailyReport_Usinagem_ENVIO_DIRETO_WHATSAPP.zip -d projeto
          ls -la projeto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle -p projeto assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyReport-WhatsApp-Direto
          path: projeto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
