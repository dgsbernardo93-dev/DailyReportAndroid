name: Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Usar sempre a mesma chave (permite atualizar o app sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp apk/debug.keystore ~/.android/debug.keystore

      - name: Montar e compilar o app
        run: |
          npm install -g cordova@12
          cordova create build com.usinagem.dailyreport "Daily Report"
          cd build
          rm -rf www res config.xml
          cp -r ../apk/www ./www
          cp -r ../apk/res ./res
          cp ../apk/config.xml ./config.xml
          cordova platform add android@13.0.0
          cordova plugin add ../apk/plugin-dailyshare
          cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: DailyReport-APK
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
